name: Solace
description: 'Solace Health is a US healthcare navigation company that connects patients
  with human patient advocates and care coordinators whose services are covered by
  insurance, including Medicare. Through solace.health and the app.solace.health member
  portal, patients are matched with an advocate who helps them understand diagnoses,
  prepare for appointments, coordinate care, manage bills, and navigate the healthcare
  system. Solace is a consumer-facing healthcare service company; as of this profile
  it does not publish a public developer program, API, SDKs, or API documentation.'
